<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<meta name="view-transition" content="same-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Favorites — Co-op Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1016;
    --bg-alt:#151824;
    --surface:#1b1f2e;
    --surface-hover:#212639;
    --border:#2a3044;
    --text:#eef1f7;
    --text-dim:#9aa0b8;
    --text-faint:#5e6478;
    --heart:#ff6b81;
    --heart-dim:#4a2733;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(91,157,255,0.08), transparent),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(92,225,160,0.06), transparent),
      var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding:48px 24px 80px;
  }

  .wrap{ max-width:1180px; margin:0 auto; }

  .top-controls{
    display:flex;
    justify-content:flex-end;
    margin-bottom:20px;
  }
  .lang-switch{ display:flex; gap:8px; }
  .lang-btn{
    display:flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.04em;
    color:var(--text-dim); background:var(--surface); border:1px solid var(--border);
    padding:7px 13px; border-radius:20px; cursor:pointer;
    transition: all 0.15s ease;
  }
  .lang-btn .flag{ font-size:15px; line-height:1; }
  .lang-btn:hover{ color:var(--text); border-color:var(--text-faint); }
  .lang-btn.active{ color:var(--bg); background:var(--text); border-color:var(--text); }

  .back-link{
    display:inline-flex; align-items:center; gap:7px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600; letter-spacing:0.04em;
    color:var(--text-dim); background:var(--surface); border:1px solid var(--border);
    padding:7px 13px; border-radius:20px; text-decoration:none;
    transition: all 0.15s ease;
  }
  .back-link:hover{ color:var(--text); border-color:var(--text-faint); }

  header{ margin:28px 0 40px; }

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin-bottom:14px;
  }
  .eyebrow::before{ content:"▸ "; color:var(--heart); }

  h1{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(22px, 4vw, 38px);
    line-height:1.5;
    letter-spacing:-0.01em;
    color:var(--text);
    text-shadow: 3px 3px 0 rgba(255,107,129,0.22);
    margin-bottom:16px;
  }

  .sub{ color:var(--text-dim); font-size:16px; max-width:620px; line-height:1.6; }

  .count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-faint);
    margin:28px 0 16px;
  }
  .count span{ color:var(--heart); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px, 1fr));
    gap:14px;
  }

  .thumb{
    position:relative;
    width:100%;
    height:130px;
    border-radius:8px;
    overflow:hidden;
    background:linear-gradient(135deg, var(--bg-alt), var(--bg));
    flex-shrink:0;
  }
  .thumb-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .thumb-placeholder{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Press Start 2P', monospace;
    font-size:22px;
    color:var(--text-faint);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .card:hover{ transform:translateY(-2px); background:var(--surface-hover); border-color:var(--text-faint); }

  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .name{ font-weight:600; font-size:16.5px; line-height:1.3; }

  .remove-btn{
    flex-shrink:0;
    width:30px; height:30px;
    display:flex; align-items:center; justify-content:center;
    font-size:15px;
    color:var(--heart);
    background:var(--heart-dim);
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    transition: all 0.15s ease;
  }
  .remove-btn:hover{ transform:scale(1.08); border-color:var(--heart); }

  .note{ font-size:13px; color:var(--text-dim); line-height:1.5; flex-grow:1; }

  .card-bottom{ display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--border); }
  .card-link-btn{
    flex:1;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.03em;
    color:var(--text-dim);
    background:var(--bg);
    border:1px solid var(--border);
    padding:9px 10px;
    border-radius:8px;
    text-decoration:none;
    transition: all 0.15s ease;
  }
  .card-link-btn:hover{ color:var(--text); border-color:var(--text-faint); }
  .card-link-btn.primary{ color:var(--bg); background:var(--text); border-color:var(--text); }
  .card-link-btn.primary:hover{ opacity:0.88; }

  .empty{
    text-align:center;
    padding:80px 20px;
    color:var(--text-faint);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    display:none;
  }
  .empty.show{ display:block; }
  .empty .big{ font-size:38px; margin-bottom:16px; }
  .empty p{ max-width:420px; margin:0 auto; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top-controls">
    <div class="lang-switch">
      <button class="lang-btn" data-lang="en" id="lang-en" aria-pressed="false"><span class="flag">🇬🇧</span>EN</button>
      <button class="lang-btn" data-lang="fr" id="lang-fr" aria-pressed="false"><span class="flag">🇫🇷</span>FR</button>
    </div>
  </div>

  <a class="back-link" href="coop-library.html" id="t-back"><span>←</span><span id="t-back-label">Back to Library</span></a>

  <header>
    <div class="eyebrow" id="t-eyebrow">Wishlist</div>
    <h1 id="t-title">FAVORITES</h1>
    <p class="sub" id="t-sub">Games you've saved from their info page. Click the heart on any game's dossier to add or remove it here.</p>
  </header>

  <div class="count"><span id="count-num">0</span> <span id="t-saved">saved</span></div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty">
    <div class="big">♡</div>
    <p id="t-empty">No favorites yet. Open a game's info page and tap the heart next to "Add to Wishlist" to save it here.</p>
  </div>

</div>

<script src="favorites.js"></script>
<script src="sidebar.js"></script>
<script>
const i18n = {
  en: {
    back: "Back to Library",
    eyebrow: "Wishlist",
    title: "FAVORITES",
    sub: "Games you've saved from their info page. Click the heart on any game's dossier to add or remove it here.",
    saved: "saved",
    emptyText: 'No favorites yet. Open a game\'s info page and tap the heart next to "Add to Wishlist" to save it here.',
    view: "View",
    steam: "Steam ↗",
    removeLabel: "Remove from favorites",
    untitled: "Untitled"
  },
  fr: {
    back: "Retour à la bibliothèque",
    eyebrow: "Liste de souhaits",
    title: "FAVORIS",
    sub: "Les jeux que vous avez enregistrés depuis leur fiche. Cliquez sur le cœur de la fiche d'un jeu pour l'ajouter ou le retirer d'ici.",
    saved: "enregistrés",
    emptyText: "Aucun favori pour l'instant. Ouvrez la fiche d'un jeu et appuyez sur le cœur à côté de « Ajouter à la liste de souhaits » pour l'enregistrer ici.",
    view: "Voir",
    steam: "Steam ↗",
    removeLabel: "Retirer des favoris",
    untitled: "Sans titre"
  }
};

let currentLang = window.CoopLang ? window.CoopLang.get() : "en";

function applyStaticTranslations(){
  const t = i18n[currentLang];
  document.documentElement.lang = currentLang;
  document.getElementById("t-back-label").textContent = t.back;
  document.getElementById("t-eyebrow").textContent = t.eyebrow;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-sub").textContent = t.sub;
  document.getElementById("t-saved").textContent = t.saved;
  document.getElementById("t-empty").textContent = t.emptyText;
  document.getElementById("lang-en").classList.toggle("active", currentLang === "en");
  document.getElementById("lang-fr").classList.toggle("active", currentLang === "fr");
  document.getElementById("lang-en").setAttribute("aria-pressed", currentLang === "en" ? "true" : "false");
  document.getElementById("lang-fr").setAttribute("aria-pressed", currentLang === "fr" ? "true" : "false");
}

function render(){
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const t = i18n[currentLang];
  const favorites = window.CoopFavorites ? window.CoopFavorites.getAll() : [];

  grid.innerHTML = "";
  document.getElementById("count-num").textContent = favorites.length;

  if(favorites.length === 0){
    empty.classList.add("show");
    return;
  }
  empty.classList.remove("show");

  favorites.forEach(g => {
    const firstLetter = (g.name || "?").charAt(0);
    const thumbHtml = g.img
      ? `<div class="thumb"><img class="thumb-img" src="${g.img}" alt="${g.name} cover art" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb-placeholder',textContent:'${firstLetter}'}))"></div>`
      : `<div class="thumb"><div class="thumb-placeholder">${firstLetter}</div></div>`;

    const viewUrl = g.infoUrl || g.steamUrl || "#";

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      ${thumbHtml}
      <div class="card-top">
        <div class="name">${g.name || t.untitled}</div>
        <button class="remove-btn" title="${t.removeLabel}" aria-label="${t.removeLabel}">♥</button>
      </div>
      <div class="note">${g.tagline || ""}</div>
      <div class="card-bottom">
        <a class="card-link-btn primary" href="${viewUrl}">${t.view}</a>
        ${g.steamUrl ? `<a class="card-link-btn" href="${g.steamUrl}" target="_blank" rel="noopener">${t.steam}</a>` : ""}
      </div>
    `;
    card.querySelector(".remove-btn").addEventListener("click", () => {
      window.CoopFavorites.remove(g.id);
      render();
    });
    grid.appendChild(card);
  });
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    if(window.CoopLang) window.CoopLang.set(currentLang);
    applyStaticTranslations();
    render();
  });
});

window.addEventListener("coopFavoritesChanged", render);
window.addEventListener("coopLangChanged", () => {
  currentLang = window.CoopLang.get();
  applyStaticTranslations();
  render();
});

applyStaticTranslations();
render();
</script>
</body>
</html>
