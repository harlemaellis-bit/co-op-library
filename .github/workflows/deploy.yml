name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # daily at 4am UTC, same as your old Netlify job
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest prices
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: node fetch-prices.js
      - name: Fetch latest game info
        run: node fetch-game-info.js
      - name: Fetch latest system requirements
        run: node fetch-spec-requirements.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
